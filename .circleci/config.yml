version: 2.1

# Define reusable commands
commands:
  notify_telegram:
    description: "Send a notification to Telegram"
    parameters:
      message:
        type: string
    steps:
      - run:
          name: Send Telegram Notification
          command: |
            MESSAGE='<< parameters.message >>'
            curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
                 -d chat_id="${TELEGRAM_CHAT_ID}" \
                 -d parse_mode="HTML" \
                 -d text="$MESSAGE"

jobs:
  deploy:
    docker:
      - image: cimg/node:20.11

    steps:
      - checkout

      - run:
          name: Setup Git author for Vercel
          command: |
            git config user.name "Meckay Ltd"
            git config user.email "meckayltd.uk@gmail.com"
            # Amend the current commit so Vercel validates the approved author.
            git commit --amend --author="Meckay Ltd <meckayltd.uk@gmail.com>" --no-edit

      - run:
          name: Notify Telegram — Deployment Started
          command: |
            COMMIT_SHA=$(git rev-parse --short HEAD)
            LAST_COMMIT_MSG=$(git log -1 --pretty=%B)
            COMMITER_NAME=$(git log -1 --pretty=%an)
            TIMESTAMP=$(date +"%Y-%m-%d %H:%M:%S")
            REPO_NAME=$(basename $(git rev-parse --show-toplevel))
            BRANCH_NAME=$(git rev-parse --abbrev-ref HEAD)
            ORG_NAME=$(git config --get remote.origin.url | sed 's#.*github.com[:/]##;s#/.*##;s/\.git$//')
            COMMIT_URL="https://github.com/$ORG_NAME/$REPO_NAME/commit/$COMMIT_SHA"

            MESSAGE="🚀 <b>Production Deployment Started</b>%0A"
            MESSAGE="$MESSAGE<b>Repository:</b> $REPO_NAME%0A"
            MESSAGE="$MESSAGE<b>Branch:</b> $BRANCH_NAME%0A"
            MESSAGE="$MESSAGE<b>Commit:</b> <a href=\"$COMMIT_URL\">$COMMIT_SHA</a>%0A"
            MESSAGE="$MESSAGE<b>Committer:</b> $COMMITER_NAME%0A"
            MESSAGE="$MESSAGE<b>Date:</b> $TIMESTAMP%0A"
            MESSAGE="$MESSAGE<b>Message:</b> $LAST_COMMIT_MSG"

            curl -s -X POST "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/sendMessage" \
                 -d chat_id="$TELEGRAM_CHAT_ID" \
                 -d parse_mode="HTML" \
                 -d text="$MESSAGE"

      - run:
          name: Install & Deploy to Vercel
          command: |
            sudo npm install -g vercel
            
            REPO_NAME="${CIRCLE_PROJECT_REPONAME:-$(basename $(git rev-parse --show-toplevel))}"
            PROJECT_NAME="${REPO_NAME//-/}"
            
            echo "Deploying to Vercel project: $PROJECT_NAME"
            
            vercel link --project "$PROJECT_NAME" --yes --token "$VERCEL_TOKEN"
            vercel deploy --prod --token "$VERCEL_TOKEN" --yes

      - run:
          name: Notify Telegram — Deployment Success
          command: |
            REPO_NAME=$(basename $(git rev-parse --show-toplevel))
            MESSAGE="✅ <b>Production Deployment Successful</b>%0A<b>Repository:</b> $REPO_NAME%0A<b>Status:</b> Success 🎉"
            curl -s -X POST "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/sendMessage" \
                -d chat_id="$TELEGRAM_CHAT_ID" \
                -d parse_mode="HTML" \
                -d text="$MESSAGE"

      - run:
          name: Notify Telegram — Deployment Failed
          when: on_fail
          command: |
            REPO_NAME=$(basename $(git rev-parse --show-toplevel))
            MESSAGE="❌ <b>Production Deployment Failed</b>%0A<b>Repository:</b> $REPO_NAME%0A<b>Status:</b> Failed 🚨"
            curl -s -X POST "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/sendMessage" \
                -d chat_id="$TELEGRAM_CHAT_ID" \
                -d parse_mode="HTML" \
                -d text="$MESSAGE"

workflows:
  deploy-to-vercel:
    jobs:
      - deploy:
          filters:
            branches:
              only:
                - main